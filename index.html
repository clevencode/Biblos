<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <!-- Web: no-referrer. Capacitor: strict-origin — auth/planos remotos (Firebase/Google). -->
    <meta name="referrer" content="no-referrer" id="biblos-referrer" />
    <script>
      (function () {
        try {
          var native =
            typeof window !== "undefined" &&
            window.Capacitor &&
            typeof window.Capacitor.isNativePlatform === "function" &&
            window.Capacitor.isNativePlatform();
          if (!native) {
            var proto = (window.location && window.location.protocol) || "";
            native = proto === "capacitor:" || proto === "ionic:";
          }
          if (native) {
            var meta = document.getElementById("biblos-referrer");
            if (meta) meta.setAttribute("content", "strict-origin-when-cross-origin");
          }
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="application-name" content="Biblos" />
    <meta name="apple-mobile-web-app-title" content="Biblos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Prototype Biblos — non destiné à l’indexation publique." />
    <script>
      (function () {
        try {
          var key = "biblos-theme";
          var pref = localStorage.getItem(key);
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          var color = dark ? "#0d1117" : "#FFFFFF";
          var ink = dark ? "#ffffff" : "#0d1117";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          root.style.backgroundColor = color;
          root.style.color = ink;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", color);
          var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (apple) apple.setAttribute("content", dark ? "black-translucent" : "default");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Biblos</title>
    <style>
      /*
       * Paint-stable boot: mesma geometria crítica que index.css (mobile)
       * para o 1.º frame não saltar quando o shell React monta.
       */
      :root {
        --mode-tabs-hub-size: 50px;
        --mode-tabs-float-gap: 22px;
        --mobile-bottom-chrome: calc(
          var(--mode-tabs-hub-size) + var(--mode-tabs-float-gap) +
            env(safe-area-inset-bottom, 0px)
        );
      }
      html, body, #root {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #0d1117;
        color: #ffffff;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root {
        background: #ffffff;
        color: #0d1117;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
