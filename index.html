<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <!-- Web: no-referrer. Capacitor: strict-origin — auth/planos remotos (Firebase/Google). -->
    <meta name="referrer" content="no-referrer" id="biblos-referrer" />
    <script>
      (function () {
        try {
          var native =
            typeof window !== "undefined" &&
            window.Capacitor &&
            typeof window.Capacitor.isNativePlatform === "function" &&
            window.Capacitor.isNativePlatform();
          if (!native) {
            var proto = (window.location && window.location.protocol) || "";
            native = proto === "capacitor:" || proto === "ionic:";
          }
          if (native) {
            var meta = document.getElementById("biblos-referrer");
            if (meta) meta.setAttribute("content", "strict-origin-when-cross-origin");
          }
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="application-name" content="Biblos" />
    <meta name="apple-mobile-web-app-title" content="Biblos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Prototype Biblos — non destiné à l’indexation publique." />
    <script>
      (function () {
        try {
          var key = "biblos-theme";
          var pref = localStorage.getItem(key);
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          var color = dark ? "#0d1117" : "#FFFFFF";
          var ink = dark ? "#ffffff" : "#0d1117";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          root.style.backgroundColor = color;
          root.style.color = ink;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", color);
          var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (apple) apple.setAttribute("content", dark ? "black-translucent" : "default");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Biblos</title>
    <style>
      /* Ouverture : fond sombre par défaut (évite flash blanc avant le boot JS). */
      html, body, #root { margin: 0; height: 100%; background: #0d1117; color: #ffffff; }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root {
        background: #ffffff;
        color: #0d1117;
      }
      .boot-shell {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 6px;
        font-family: Outfit, "Avenir Next", "Segoe UI", sans-serif;
        text-align: center;
        background: #0d1117;
        color: #ffffff;
      }
      html[data-theme="light"] .boot-shell {
        background: #ffffff;
        color: #0d1117;
      }
      #splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        margin: 0;
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 6px;
        font-family: Outfit, "Avenir Next", "Segoe UI", sans-serif;
        text-align: center;
        background: #0d1117;
        color: #ffffff;
        transition: opacity 240ms ease-out;
        pointer-events: none;
      }
      html[data-theme="light"] #splash-overlay {
        background: #ffffff;
        color: #0d1117;
      }
      #splash-overlay[data-hidden="true"] {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-overlay { transition: none; }
        .boot-progress-bar { animation: none; width: 55%; left: 22.5%; }
      }
      .boot-brand { margin: 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; }
      /* Alinhado a --muted (tone-400 dark / tone-500 light) */
      .boot-muted { margin: 0; color: color-mix(in srgb, #0d1117 40%, #ffffff); font-size: 0.9rem; }
      html[data-theme="light"] .boot-muted { color: color-mix(in srgb, #0d1117 55%, #ffffff); }
      .boot-progress {
        position: relative;
        width: 7.5rem;
        height: 2px;
        margin: 10px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 14%, transparent);
      }
      .boot-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: #38bdf8;
        box-shadow: 0 0 8px color-mix(in srgb, #38bdf8 65%, transparent);
        animation: boot-slide-bar 0.9s ease-in-out infinite;
      }
      html[data-theme="light"] .boot-progress-bar {
        background: #0284c7;
        box-shadow: 0 0 8px color-mix(in srgb, #0284c7 45%, transparent);
      }
      @keyframes boot-slide-bar {
        0% { left: 0%; width: 0%; }
        50% { left: 25%; width: 55%; }
        100% { left: 100%; width: 0%; }
      }
    </style>
  </head>
  <body>
    <div id="splash-overlay" class="boot-shell" aria-busy="true" aria-label="Ouverture">
      <p class="boot-brand">Biblos</p>
      <div class="boot-progress" role="progressbar" aria-label="Ouverture">
        <span class="boot-progress-bar" aria-hidden="true"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
