<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="application-name" content="Biblos" />
    <meta name="apple-mobile-web-app-title" content="Biblos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Prototype Biblos — non destiné à l’indexation publique." />
    <script>
      (function () {
        try {
          var key = "biblos-theme";
          var pref = localStorage.getItem(key);
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          var color = dark ? "#0d1117" : "#FFFFFF";
          var ink = dark ? "#ffffff" : "#0d1117";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          root.style.backgroundColor = color;
          root.style.color = ink;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", color);
          var apple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (apple) apple.setAttribute("content", dark ? "black-translucent" : "default");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Biblos</title>
    <style>
      /* Ouverture : fond sombre par défaut (évite flash blanc avant le boot JS). */
      html, body, #root { margin: 0; height: 100%; background: #0d1117; color: #ffffff; }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root {
        background: #ffffff;
        color: #0d1117;
      }
      .boot-shell {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 6px;
        font-family: Outfit, "Avenir Next", "Segoe UI", sans-serif;
        text-align: center;
        background: #0d1117;
        color: #ffffff;
      }
      html[data-theme="light"] .boot-shell {
        background: #ffffff;
        color: #0d1117;
      }
      .boot-brand { margin: 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; }
      .boot-muted { margin: 0; color: #9ca3af; font-size: 0.9rem; }
      html[data-theme="light"] .boot-muted { color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-busy="true">
        <p class="boot-brand">Biblos</p>
        <p class="boot-muted">Ouverture…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
