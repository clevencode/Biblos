# Tag v* ou workflow_dispatch → build APK release assinado → upload R2 (mesmo object key).
#
# Secrets obrigatórios (repo → Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   — jks em base64 (ver docs no fim do job / chat)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_API_TOKEN      — R2 Edit
#   VITE_APK_DOWNLOAD_URL     — URL público do objecto (ex. https://pub-….r2.dev/Biblos.apk)
#
# Secrets opcionais (Firebase no APK):
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID
#   GOOGLE_SERVICES_JSON_BASE64
#
# Variables (opcional, defaults ok):
#   R2_BUCKET=biblos-releases
#   R2_OBJECT_KEY=Biblos.apk
#
# Uso: bump código se quiseres, depois:
#   git tag v0.2.8 && git push origin v0.2.8
# Ou Actions → Publish APK to R2 → Run workflow

name: Publish APK to R2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_APK_DOWNLOAD_URL: ${{ secrets.VITE_APK_DOWNLOAD_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: R2 target defaults
        run: |
          echo "R2_BUCKET=${R2_BUCKET_VAR:-biblos-releases}" >> "$GITHUB_ENV"
          echo "R2_OBJECT_KEY=${R2_OBJECT_KEY_VAR:-Biblos.apk}" >> "$GITHUB_ENV"
        env:
          R2_BUCKET_VAR: ${{ vars.R2_BUCKET }}
          R2_OBJECT_KEY_VAR: ${{ vars.R2_OBJECT_KEY }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pacote legado "tools" já não existe no sdkmanager actual.
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform / build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 em falta"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/biblos-upload.jks
          test -s android/keystore/biblos-upload.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=keystore/biblos-upload.jks" \
            > android/key.properties

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "Sem GOOGLE_SERVICES_JSON_BASE64 — build sem plugin Google Services"
          fi

      - name: Write .env for Vite (mobile bundle)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "$VITE_APK_DOWNLOAD_URL" ]; then
            echo "Secret VITE_APK_DOWNLOAD_URL em falta"
            exit 1
          fi
          {
            echo "VITE_APK_DOWNLOAD_URL=$VITE_APK_DOWNLOAD_URL"
            if [ -n "$VITE_FIREBASE_API_KEY" ]; then echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY"; fi
            if [ -n "$VITE_FIREBASE_AUTH_DOMAIN" ]; then echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN"; fi
            if [ -n "$VITE_FIREBASE_PROJECT_ID" ]; then echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID"; fi
            if [ -n "$VITE_FIREBASE_APP_ID" ]; then echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID"; fi
          } > .env

      - name: Resolve version (tag → versionName; 1000+run_number → versionCode)
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          fi
          # Offset para versionCode CI > builds locais (ex. 6) e sempre crescente.
          echo "CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Apply version to package.json / build.gradle
        run: |
          node <<'EOF'
          const fs = require("fs");
          const version = process.env.VERSION;
          const code = process.env.CODE;
          if (!version || !code) {
            console.error("VERSION/CODE em falta", { version, code });
            process.exit(1);
          }
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = version;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          let gradle = fs.readFileSync("android/app/build.gradle", "utf8");
          gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${code}`);
          gradle = gradle.replace(/versionName\s+"[^"]*"/, `versionName "${version}"`);
          fs.writeFileSync("android/app/build.gradle", gradle);
          console.log(`OK versionName=${version} versionCode=${code}`);
          EOF

      - name: Install npm deps
        run: npm ci

      - name: Build web (Capacitor) + sync Android
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Assemble release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Publish APK to R2
        run: node scripts/publish-apk-r2.mjs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biblos-${{ env.VERSION }}-${{ env.CODE }}
          path: android/app/build/outputs/apk/release/Biblos.apk
          if-no-files-found: error
